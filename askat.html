<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Машина Слайдери</title>
  <link rel="stylesheet" href="./askat.css">
  <style>
    body {
      font-family: sans-serif;
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .slider {
      position: relative;
      width: 600px;
      height: 400px;
      overflow: hidden;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }
    .slides {
      display: flex;
      width: 100%;
      height: 100%;
      transition: transform 0.5s ease;
    }
    .slide {
      min-width: 100%;
      height: 100%;
    }
    .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 30px;
      color: white;
      background-color: rgba(0, 0, 0, 0.4);
      border: none;
      cursor: pointer;
      padding: 10px;
      z-index: 10;
    }
    .prev {
      left: 10px;
    }
    .next {
      right: 10px;
    }
  </style>
</head>
<body>

<div class="slider">
  <div class="slides" id="slides">
    <div class="slide"><img src="./img/cHJpdmF0ZS9sci9pbWFnZXMvd2Vic2l0ZS8yMDI0LTAyL3Jhd3BpeGVsb2ZmaWNlMTFfYV9ibGFja19zaWxob3VldHRlX2Nhcl9sb2dvX2ljb25fb25fYV93aGl0ZV9iYV9iYmFiMWM0YS1jZTVhLTRlM2ItOTY2ZC0yYTYzYTE4NDI0ZTVfMS5wbmc.webp" alt="Car 1"></div>
    <div class="slide"><img src="./img/luxurious-car-parked-highway-with-illuminated-headlight-sunset_181624-60607.avif" alt="Car 2"></div>
    <div class="slide"><img src="./img/pngtree-luxury-modern-convertible-car-png-image_4308920.png" alt="Car 3"></div>
  </div>
  <button class="nav-btn prev" onclick="prevSlide()"></button>
  <button class="nav-btn next" onclick="nextSlide()"></button>
</div>34

<script>
  let index = 0;
  const slides = document.getElementById('slides');
  const totalSlides = slides.children.length;

  function showSlide(i) {
    index = (i + totalSlides) % totalSlides;
    slides.style.transform = `translateX(${-index * 100}%)`;
  }

  function nextSlide() {
    showSlide(index + 1);
  }

  function prevSlide() {
    showSlide(index - 1);
  }

  showSlide(index);
</script>

</body>
</html>
